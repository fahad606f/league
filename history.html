<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السجل الشرفي | دوري الأبطال</title>
    <script src="data.js"></script>
    <style>
        :root {
            --bg-color: #243456; 
            --card-bg: #354a78; 
            --score-bg: #465f9a; 
            --text-main: #ffffff;
            --text-muted: #c5d2ee; 
            --gold: #FFD700;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 15px; text-align: center;
        }
        .styled-box {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            margin: 0 auto 15px auto;
            max-width: 75%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .box-divider {
            border: 0; height: 1px; background: rgba(255, 255, 255, 0.15); margin: 12px 0;
        }
        .history-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .history-item:last-child { border-bottom: none; }
        .season-title { color: var(--gold); font-weight: bold; font-size: 16px; margin-bottom: 8px; }
        .winners-list { color: var(--text-main); font-size: 14px; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
        
        .winner-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--score-bg); padding: 4px 10px; border-radius: 20px;
        }
        img.winner-img { width: 25px; height: 25px; border-radius: 50%; object-fit: cover; border: 1px solid var(--gold); }

        .nav-btn {
            display: inline-block; padding: 10px 20px; background: var(--score-bg); color: white;
            text-decoration: none; border-radius: 10px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.15);
            font-weight: bold; font-size: 13px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="nav-btn">⬅ العودة للرئيسية</a>

    <div class="styled-box">
        <h3 style="color: var(--gold); margin-top: 0;">🏆 السجل الشرفي للبطولات</h3>
        <div class="box-divider"></div>
        <div id="history-container"></div>
    </div>

    <script>
        let historyHtml = "";
        if(DB.history && DB.history.length > 0) {
            DB.history.forEach(h => {
                let winnersHtml = "";
                h.winners.forEach(winnerName => {
                    // البحث عما إذا كان الفائز مسجلاً في قائمة اللاعبين لجلب صورته
                    let player = DB.players ? DB.players.find(p => p.name === winnerName) : null;
                    if(player) {
                        winnersHtml += `<span class="winner-badge"><img src="${player.image}" class="winner-img">${winnerName}</span>`;
                    } else {
                        winnersHtml += `<span class="winner-badge">${winnerName}</span>`;
                    }
                });

                historyHtml += `
                <div class="history-item">
                    <div class="season-title">🏅 ${h.season}</div>
                    <div class="winners-list">البطل: ${winnersHtml}</div>
                </div>`;
            });
        } else {
            historyHtml = "<div style='color: var(--text-muted);'>لا توجد بطولات مسجلة حتى الآن</div>";
        }
        document.getElementById('history-container').innerHTML = historyHtml;
    </script>
</body>
</html>
