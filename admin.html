<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة | دوري الأبطال</title>
    <script src="data.js"></script>
    <style>
        :root {
            --bg-color: #243456; 
            --card-bg: #354a78; 
            --score-bg: #465f9a; 
            --text-main: #ffffff;
            --text-muted: #c5d2ee; 
            --gold: #FFD700;
            --green: #4CAF50;
            --red: #f44336;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 10px; text-align: center;
            box-sizing: border-box;
            font-size: 16px; /* خط رئيسي كبير وواضح */
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        #login-screen {
            max-width: 380px;
            margin: 80px auto;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #login-screen h2 { color: var(--gold); margin-bottom: 20px; font-size: 20px; }
        #login-screen input {
            width: 80%; padding: 10px; font-size: 16px; border-radius: 8px; border: none;
            text-align: center; margin-bottom: 15px; background: rgba(0,0,0,0.2); color: white;
        }
        #login-screen button {
            padding: 10px 25px; background: var(--score-bg); color: white; border: none;
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .error-msg { color: var(--red); font-size: 14px; margin-top: 10px; display: none; }

        #admin-panel { display: none; max-width: 550px; margin: 0 auto; text-align: right; width: 100%; }
        
        .panel-section {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
            overflow: hidden;
        }
        .panel-section h3 { 
            color: var(--gold); 
            margin-top: 0; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding-bottom: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 17px; /* خط العنوان واضح */
            flex-wrap: wrap;
            gap: 8px;
        }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 14px; color: var(--text-muted); }
        
        /* تقليص عرض المربعات مع الحفاظ على خط كبير وواضح 15px */
        .form-group input, .form-group select {
            width: 65%; max-width: 280px; padding: 7px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2); color: white; font-size: 15px; font-family: inherit;
        }

        .players-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            width: 100%;
        }
        @media (min-width: 520px) {
            .players-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .player-edit-card {
            background: rgba(0,0,0,0.15);
            padding: 8px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            width: 100%;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            gap: 4px;
        }
        .inputs-row { display: flex; gap: 4px; width: 100%; }
        .inputs-row div { flex: 1; min-width: 0; }
        .inputs-row input {
            width: 100%; padding: 5px 2px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2); color: white; text-align: center; font-size: 14px; font-weight: bold;
        }

        .item-card {
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.05);
            width: 100%;
        }

        /* تخطيط المواجهات ملموم وبخط كبير وواضح */
        .match-row-grid {
            display: grid;
            grid-template-columns: 1fr 0.5fr 20px 0.5fr 1fr 0.8fr auto;
            gap: 4px;
            align-items: center;
            width: 100%;
        }
        @media (max-width: 768px) {
            .match-row-grid {
                grid-template-columns: 1fr 25px 1fr;
                gap: 6px;
            }
            .match-row-grid input[type="text"]:nth-of-type(1) { grid-column: 1 / -1; }
            .match-row-grid input[type="text"]:nth-of-type(2) { grid-column: 1 / -1; }
            .match-row-grid select { grid-column: span 2; }
            .match-row-grid .btn-delete { grid-column: span 1; }
        }

        .match-row-grid input, .match-row-grid select {
            background: rgba(0,0,0,0.2); 
            border: 1px solid rgba(255,255,255,0.2); 
            color: white;
            padding: 6px 4px; 
            border-radius: 5px; 
            font-size: 14px; 
            width: 100%;
            text-align: center;
            font-family: inherit;
        }
        .match-row-grid input[type="text"] {
            text-align: right;
            padding-right: 6px;
        }

        .row-flex {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 5px;
            width: 100%;
        }
        .row-flex input, .row-flex select {
            background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.2); color: white;
            padding: 6px; border-radius: 5px; font-size: 14px; width: 100%; font-family: inherit;
        }

        .btn-add {
            background: var(--score-bg); color: white; border: none; padding: 6px 10px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;
            white-space: nowrap;
        }
        .btn-delete {
            background: var(--red); color: white; border: none; padding: 5px 8px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;
            white-space: nowrap;
        }

        .action-bar {
            position: sticky; bottom: 10px; text-align: center; background: rgba(36, 52, 86, 0.95);
            padding: 10px; border-radius: 10px; box-shadow: 0 -4px 10px rgba(0,0,0,0.5); z-index: 100;
            width: 100%;
        }
        .save-btn {
            background: var(--green); color: white; padding: 10px 20px; font-size: 16px;
            font-weight: bold; border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 280px;
        }
        .success-alert { color: var(--green); font-weight: bold; margin-top: 6px; display: none; font-size: 13px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>🔒 لوحة التحكم</h2>
        <p style="color: var(--text-muted); font-size: 14px;">أدخل الرقم السري للمتابعة</p>
        <input type="password" id="pin-input" placeholder="الرقم السري">
        <br>
        <button onclick="checkPin()">دخول</button>
        <div id="error-msg" class="error-msg">الرقم السري غير صحيح!</div>
    </div>

    <div id="admin-panel">
        <h1 style="color: var(--gold); text-align: center; margin-bottom: 15px; font-size: 20px;">⚙️ لوحة إدارة دوري الأبطال</h1>

        <div class="panel-section">
            <h3>📢 إعدادات الإعلان (البنر)</h3>
            <div class="form-group">

                <input type="text" id="edit-banner-text">

            <div class="form-group">
                <label>حالة الإعلان:</label>
                <select id="edit-banner-show">
                    <option value="true">إظهار</option>
                    <option value="false">إخفاء</option>
                </select>
            </div>
        </div>

        <!-- 2. حالة الدوري (انتهى الدوري) -->
        <div class="panel-section">
            <h3>🏁 حالة الدوري العامة</h3>
            <div class="form-group">
                <label>حالة منافسات الدوري:</label>
                <select id="edit-league-ended">
                    <option value="false">الدوري جارٍ (عرض المباريات)</option>
                    <option value="true">انتهى الدوري (عرض رسالة انتهاء الدوري)</option>
                </select>
            </div>
        </div>
