<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | إدارة الدوري</title>
    <script src="data.js"></script>
    <style>
        :root {
            --bg-color: #1a233a;
            --card-bg: rgba(36, 52, 86, 0.95);
            --score-bg: #465f9a;
            --text-main: #ffffff;
            --text-muted: #c5d2ee;
            --gold: #FFD700;
            --green: #4CAF50;
            --red: #f44336;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 15px; text-align: center;
        }

        .admin-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .styled-box {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 15px 20px;
            margin: 0 auto 12px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .box-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 15px; color: var(--gold); margin-bottom: 8px; font-weight: bold;
        }

        .box-divider {
            border: 0; height: 1px; background: rgba(255, 255, 255, 0.15); margin-bottom: 12px;
        }

        .match-edit-row {
            display: flex; justify-content: space-between; align-items: center;
            gap: 10px; margin-bottom: 10px;
        }

        .team-lbl {
            flex: 1; font-weight: bold; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .score-input {
            width: 50px; text-align: center; background-color: var(--score-bg);
            color: white; border: none; border-radius: 8px; padding: 6px; font-size: 16px; font-weight: bold;
        }

        .status-select {
            background-color: #2c3e50; color: white; border: 1px solid rgba(255,255,255,0.2);
            padding: 6px 10px; border-radius: 8px; font-family: inherit; font-weight: bold;
        }

        .save-btn {
            background: linear-gradient(135deg, var(--green), #388E3C);
            color: white; border: none; padding: 8px 18px; border-radius: 10px;
            font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 5px;
            font-family: inherit; box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        .save-btn:active { transform: scale(0.97); }

        .nav-link {
            display: inline-block; margin-bottom: 20px; padding: 10px 20px;
            background: var(--score-bg); color: white; text-decoration: none;
            border-radius: 10px; font-weight: bold; font-size: 14px;
        }

        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(26, 35, 58, 0.95); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
        .auth-card {
            background-color: var(--card-bg); padding: 25px; border-radius: 16px;
            width: 80%; max-width: 320px; border: 1px solid var(--gold);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5); text-align: center;
        }
        .auth-input {
            width: 80%; padding: 10px; margin: 15px 0; text-align: center;
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2);
            color: white; border-radius: 8px; font-size: 18px; font-weight: bold; letter-spacing: 5px;
        }
        .auth-btn {
            background: linear-gradient(135deg, var(--gold), #ff9900);
            color: #1c2742; border: none; padding: 10px 20px; border-radius: 10px;
            font-weight: bold; font-size: 15px; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h3 style="color: var(--gold); margin-top: 0;">🔒 لوحة التحكم</h3>
            <p style="font-size: 13px; color: var(--text-muted);">الرجاء إدخال رقم التعريف (PIN)</p>
            <input type="password" id="pin-input" class="auth-input" maxlength="6" placeholder="******">
            <br>
            <button type="button" class="auth-btn" onclick="checkPin()">دخول</button>
            <p id="pin-error" style="color: var(--red); font-size: 12px; margin-top: 10px; display: none;">الرقم السري غير صحيح!</p>
        </div>
    </div>

    <div class="admin-container" id="admin-content" style="display: none;">
        <div style="text-align: right; margin-bottom: 10px;">
            <a href="index.html" class="nav-link">🏠 العودة للرئيسية</a>
        </div>

        <h2 style="color: var(--gold); margin-bottom: 20px;">⚙️ إدارة وتحديث المباريات</h2>
        
        <div id="admin-matches-area"></div>
    </div>

    <script>
        function checkPin() {
            let enteredPin = document.getElementById('pin-input').value;
            if (enteredPin === "322332") {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                renderAdminMatches();
            } else {
                document.getElementById('pin-error').style.display = 'block';
            }
        }

        function getMatchWinner(matchObj) {
            if (!matchObj || matchObj.status !== 'finished') return null;
            if (matchObj.score1 > matchObj.score2) return matchObj.team1;
            if (matchObj.score2 > matchObj.score1) return matchObj.team2;
            return null;
        }

        function renderAdminMatches() {
            if (typeof DB === 'undefined' || !DB.matches) {
                document.getElementById('admin-matches-area').innerHTML = `
                    <div class="styled-box"><p style="color:var(--red);">خطأ في بيانات المباريات</p></div>`;
                return;
            }

            let round1 = DB.matches;
            let isRound1Complete = round1.length > 0 && round1.every(m => m.status === 'finished');

            // تجهيز الدور الثاني
            if (!DB.round2Matches) DB.round2Matches = [];
            let round2 = [];
            for (let i = 0; i < round1.length; i += 2) {
                let m1 = round1[i];
                let m2 = round1[i+1];
                let teamA = getMatchWinner(m1) || "[متأهل 1]";
                let teamB = m2 ? (getMatchWinner(m2) || "[متأهل 2]") : "---";
                
                if (!DB.round2Matches[i/2]) {
                    DB.round2Matches[i/2] = { team1: teamA, team2: teamB, score1: 0, score2: 0, status: 'pending' };
                } else {
                    DB.round2Matches[i/2].team1 = teamA;
                    DB.round2Matches[i/2].team2 = teamB;
                }
                round2.push(DB.round2Matches[i/2]);
            }

            let isRound2Complete = round2.length > 0 && round2.every(m => m.status === 'finished');

            // تجهيز النهائي أو الدور المتقدم
            let finalTeam1 = round2.length > 0 ? (getMatchWinner(round2[0]) || "[طرف 1]") : "[طرف 1]";
            let finalTeam2 = round2.length > 1 ? (getMatchWinner(round2[1]) || "[طرف 2]") : (round2.length > 0 ? (round2[0].team2 || "[طرف 2]") : "[طرف 2]");
            
            if (!DB.finalMatch) {
                DB.finalMatch = { team1: finalTeam1, team2: finalTeam2, score1: 0, score2: 0, status: 'pending' };
            } else {
                DB.finalMatch.team1 = finalTeam1;
                DB.finalMatch.team2 = finalTeam2;
            }

            let html = "";
            let globalIndex = 1;

            if (!isRound1Complete) {
                // عرض الدور الأول
                round1.forEach((m, index) => {
                    html += `
                    <div class="styled-box">
                        <div class="box-header">
                            <span>مباراة رقم ${globalIndex++} (الدور الأول)</span>
                            <select id="status-${index}" class="status-select">
                                <option value="pending" ${m.status === 'pending' ? 'selected' : ''}>قادمة</option>
                                <option value="finished" ${m.status === 'finished' ? 'selected' : ''}>انتهت</option>
                            </select>
                        </div>
                        <hr class="box-divider">
                        <div class="match-edit-row">
                            <span class="team-lbl" style="text-align: right;">${m.team1}</span>
                            <input type="number" id="score1-${index}" class="score-input" value="${m.score1}">
                            <span style="font-weight: bold; color: var(--text-muted);">VS</span>
                            <input type="number" id="score2-${index}" class="score-input" value="${m.score2}">
                            <span class="team-lbl" style="text-align: left;">${m.team2}</span>
                        </div>
                        <button type="button" class="save-btn" onclick="saveMatch(${index})">حفظ التعديل</button>
                    </div>`;
                });
            } else if (!isRound2Complete) {
                // عرض الدور الثاني بعد اكتمال الدور الأول
                round2.forEach((m, index) => {
                    html += `
                    <div class="styled-box" style="border: 1px dashed var(--gold);">
                        <div class="box-header">
                            <span style="color: var(--gold);">🔄 مباراة رقم ${globalIndex++} (الدور الثاني - تلقائي)</span>
                            <select id="r2-status-${index}" class="status-select">
                                <option value="pending" ${m.status === 'pending' ? 'selected' : ''}>قادمة</option>
                                <option value="finished" ${m.status === 'finished' ? 'selected' : ''}>انتهت</option>
                            </select>
                        </div>
                        <hr class="box-divider">
                        <div class="match-edit-row">
                            <span class="team-lbl" style="text-align: right;">${m.team1}</span>
                            <input type="number" id="r2-score1-${index}" class="score-input" value="${m.score1}">
                            <span style="font-weight: bold; color: var(--text-muted);">VS</span>
                            <input type="number" id="r2-score2-${index}" class="score-input" value="${m.score2}">
                            <span class="team-lbl" style="text-align: left;">${m.team2}</span>
                        </div>
                        <button type="button" class="save-btn" onclick="saveRound2Match(${index})">حفظ التعديل</button>
                    </div>`;
                });
            } else {
                // عرض النهائي الكبير
                let m = DB.finalMatch;
                html += `
                <div class="styled-box" style="border: 2px solid var(--gold); background: rgba(55,40,85,0.9);">
                    <div class="box-header">
                        <span style="color: var(--gold); font-weight: bold;">🏆 النهائي الكبير</span>
                        <select id="final-status" class="status-select">
                            <option value="pending" ${m.status === 'pending' ? 'selected' : ''}>قادمة</option>
                            <option value="finished" ${m.status === 'finished' ? 'selected' : ''}>انتهت</option>
                        </select>
                    </div>
                    <hr class="box-divider">
                    <div class="match-edit-row">
                        <span class="team-lbl" style="text-align: right; color: var(--gold);">${m.team1}</span>
                        <input type="number" id="final-score1" class="score-input" value="${m.score1}">
                        <span style="font-weight: bold; color: var(--text-muted);">VS</span>
                        <input type="number" id="final-score2" class="score-input" value="${m.score2}">
                        <span class="team-lbl" style="text-align: left; color: var(--gold);">${m.team2}</span>
                    </div>
                    <button type="button" class="save-btn" onclick="saveFinalMatch()">حفظ النهائي</button>
                </div>`;
            }

            document.getElementById('admin-matches-area').innerHTML = html;
        }

        function saveMatch(index) {
            DB.matches[index].score1 = parseInt(document.getElementById(`score1-${index}`).value) || 0;
            DB.matches[index].score2 = parseInt(document.getElementById(`score2-${index}`).value) || 0;
            DB.matches[index].status = document.getElementById(`status-${index}`).value;
            
            alert("تم حفظ وتحديث نتيجة المباراة بنجاح! ✅");
            renderAdminMatches();
        }

        function saveRound2Match(index) {
            DB.round2Matches[index].score1 = parseInt(document.getElementById(`r2-score1-${index}`).value) || 0;
            DB.round2Matches[index].score2 = parseInt(document.getElementById(`r2-score2-${index}`).value) || 0;
            DB.round2Matches[index].status = document.getElementById(`r2-status-${index}`).value;
            
            alert("تم حفظ وتحديث نتيجة الدور الثاني بنجاح! ✅");
            renderAdminMatches();
        }

        function saveFinalMatch() {
            DB.finalMatch.score1 = parseInt(document.getElementById(`final-score1`).value) || 0;
            DB.finalMatch.score2 = parseInt(document.getElementById(`final-score2`).value) || 0;
            DB.finalMatch.status = document.getElementById(`final-status`).value;
            
            if (DB.finalMatch.status === 'finished') {
                DB.settings.leagueEnded = true;
            }
            
            alert("تم حفظ نتيجة النهائي الكبير بنجاح! 🏆");
            renderAdminMatches();
        }
    </script>
</body>
</html>
