<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية | دوري الأبطال</title>
    <script src="data.js"></script>
    <style>
        :root {
            --bg-color: #1a233a; 
            --card-bg: rgba(36, 52, 86, 0.9); 
            --score-bg: #465f9a; 
            --finished-bg: #1c2742; 
            --text-main: #ffffff;
            --text-muted: #c5d2ee; 
            --gold: #FFD700;
            --green: #4CAF50;
            --red: #f44336;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 15px; text-align: center;
        }

        /* الإعلانات */
        #ad-banner {
            background: linear-gradient(90deg, #ff8a00, #e52e71);
            color: white; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 16px;
            overflow: hidden; white-space: nowrap; margin-bottom: 20px; display: none;
        }
        .marquee { 
            display: inline-block; 
            animation: marquee 25s linear infinite; 
        }
        @keyframes marquee { 
            0% { transform: translateX(-100%); } 
            100% { transform: translateX(100%); } 
        }

        /* الصناديق الأساسية */
        .styled-box {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 12px 18px;
            margin: 0 auto 8px auto;
            max-width: 80%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .styled-box.finished-box {
            background-color: var(--finished-bg);
            opacity: 0.85;
        }

        .box-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 15px; color: var(--text-muted); margin-bottom: 6px; font-weight: bold;
        }
        .box-divider {
            border: 0; height: 1px; background: rgba(255, 255, 255, 0.15); margin-bottom: 8px;
        }
        .box-content {
            display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; font-size: 17px;
        }
        
        .section-main-title {
            color: var(--gold);
            font-size: 19px;
            font-weight: bold;
            text-align: right;
            max-width: 80%;
            margin: 20px auto 10px auto;
        }
        
        .score-container {
            display: flex; align-items: center; gap: 10px;
            color: var(--text-muted); font-size: 14px;
        }
        .score-box {
            background-color: var(--score-bg); padding: 5px 12px;
            border-radius: 10px; color: var(--text-main); font-size: 17px;
        }

        /* بطاقة أفضل لاعب MVP */
        .mvp-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            margin: 15px auto;
            max-width: 60%;
            border: 1px solid var(--gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .mvp-title { font-size: 14px; margin-bottom: 5px; color: var(--gold); font-weight: bold; }
        
        .mvp-avatar-container {
            position: relative;
            display: inline-block;
            margin: 15px auto 5px auto;
        }
        
        .crown-icon {
            position: absolute;
            top: -48px;
            left: -48px;
            transform: rotate(-30deg);
            font-size: 75px;
            z-index: 0;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        .mvp-img-wrapper {
            position: relative; 
            width: 110px; height: 110px;
            border-radius: 50%; 
            border: 3px solid var(--gold); 
            overflow: hidden;
            z-index: 1;
            background-color: var(--card-bg);
        }
        .mvp-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .mvp-img-wrapper::after {
            content: ""; position: absolute; top: 0; left: -100%;
            width: 50%; height: 100%; background: rgba(255,255,255,0.4);
            transform: skewX(-20deg); animation: shine 3s infinite;
        }
        @keyframes shine { 100% { left: 200%; } }
        
        #mvp-name { font-size: 18px; margin-top: 10px; font-weight: bold; color: var(--gold); }

        .winner { color: var(--green); }
        .loser { text-decoration: line-through; color: var(--red); }
        .team-name { flex: 1; text-align: center; }
        .team-right { text-align: right; }
        .team-left { text-align: left; }

        /* إحصائيات اللاعبين */
        .player-stat-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); font-size: 17px;
            font-weight: bold;
        }
        .player-stat-row:last-child { border-bottom: none; }
        
        .player-info {
            display: flex; align-items: center; gap: 12px;
        }
        
        .rank-box {
            min-width: 26px;
            height: 26px;
            background-color: rgba(0, 0, 0, 0.3);
            color: var(--gold);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
        }

        img.player-icon { 
            width: 50px; height: 50px;
            border-radius: 50%; object-fit: cover; 
            border: 2px solid var(--gold); 
        }

        .nav-buttons { margin-bottom: 15px; }
        .nav-buttons a {
            display: inline-block; padding: 10px 20px; background: var(--score-bg); color: white;
            text-decoration: none; border-radius: 10px; margin: 5px; border: 1px solid rgba(255,255,255,0.15);
            font-family: inherit; font-size: 14px; font-weight: bold;
        }

        /* زر التبديل */
        .toggle-btn {
            background: linear-gradient(135deg, #FFD700, #ff9900);
            color: #1c2742;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            font-family: inherit;
        }

        /* الشجرة المفتوحة والمرنة */
        .bracket-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            padding-bottom: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .bracket-master-container {
            position: relative;
            background: linear-gradient(135deg, #162238 0%, #243456 50%, #162238 100%);
            border-radius: 16px;
            padding: 15px 10px;
            margin: 0 auto;
            min-width: 550px;
            overflow: hidden;
            border: 1px solid rgba(255,215,0,0.25);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .bracket-master-container::before {
            content: "🏆";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 200px;
            opacity: 0.04;
            z-index: 0;
            pointer-events: none;
        }

        .dynamic-tree-flex {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .bracket-column {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .bracket-node-card {
            background: rgba(30, 45, 75, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 5px;
            font-size: 11px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
        }

        .bracket-row-match {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            margin: 2px 0;
        }

        .bracket-team-txt {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70px;
        }

        .bracket-num-badge {
            background: var(--score-bg);
            padding: 1px 4px;
            border-radius: 4px;
            font-size: 10px;
            min-width: 16px;
            text-align: center;
        }

        .hub-trophy-label {
            color: var(--gold);
            font-size: 12px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.3);
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,215,0,0.3);
            margin-bottom: 6px;
            text-align: center;
        }

        .hub-match-box {
            background: rgba(40, 60, 95, 0.95);
            border: 1px solid rgba(255,215,0,0.4);
            border-radius: 8px;
            padding: 6px;
            width: 100%;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <div id="ad-banner"><div class="marquee" id="ad-text"></div></div>

    <div class="nav-buttons">
        <a href="league.html">📊 إحصائيات اللاعبين</a>
        <a href="history.html">🏆 السجل الشرفي</a>
    </div>

    <!-- بطاقة أفضل لاعب MVP -->
    <div class="mvp-card">
        <div class="mvp-title">🌟 نجم الجولة</div>
        <div class="mvp-avatar-container">
            <div class="crown-icon">👑</div>
            <div class="mvp-img-wrapper">
                <img id="mvp-img" src="" alt="MVP">
            </div>
        </div>
        <div id="mvp-name"></div>
    </div>

    <!-- أعلى الهدافين -->
    <div class="styled-box">
        <div class="box-header">
            <span style="font-size: 17px; color: var(--gold); font-weight: bold;">⚽ أعلى الهدافين</span>
            <span>الأهداف</span>
        </div>
        <hr class="box-divider">
        <div id="top-scorers"></div>
    </div>

    <!-- أعلى صناع اللعب -->
    <div class="styled-box">
        <div class="box-header">
            <span style="font-size: 17px; color: var(--gold); font-weight: bold;">🎯 أعلى صناع اللعب</span>
            <span>الصناعة</span>
        </div>
        <hr class="box-divider">
        <div id="top-assists"></div>
    </div>

    <!-- قسم مواجهات الدوري مع زر التبديل -->
    <div id="matches-section-wrapper">
        <div class="section-main-title" style="display: flex; justify-content: space-between; align-items: center;">
            <span>⚔️ مواجهات الدوري</span>
            <div style="margin: 0;">
                <button type="button" class="toggle-btn" id="toggleViewBtn" onclick="toggleViewMode()">🔀 عرض شجري</button>
            </div>
        </div>
        
        <div id="matches-display-area"></div>
    </div>

    <script>
        if(DB.settings.showBanner) {
            document.getElementById('ad-banner').style.display = 'block';
            document.getElementById('ad-text').innerText = DB.settings.bannerText;
        }

        document.getElementById('mvp-img').src = DB.lastMvp.image;
        document.getElementById('mvp-name').innerText = DB.lastMvp.name;

        let players = DB.players.slice();
        
        let topScorersHtml = "";
        let topScorers = players.sort((a, b) => b.goals - a.goals).slice(0, 3);
        topScorers.forEach((p, index) => {
            let rank = index + 1;
            topScorersHtml += `
            <div class="player-stat-row">
                <div class="player-info">
                    <div class="rank-box">${rank}</div>
                    <img src="${p.image}" class="player-icon" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'"> 
                    <span>${p.name}</span>
                </div>
                <div class="score-box" style="padding: 4px 12px; font-size: 16px;">${p.goals}</div>
            </div>`;
        });
        document.getElementById('top-scorers').innerHTML = topScorersHtml;

        let topAssistsHtml = "";
        let topAssists = players.sort((a, b) => b.assists - a.assists).slice(0, 3);
        topAssists.forEach((p, index) => {
            let rank = index + 1;
            topAssistsHtml += `
            <div class="player-stat-row">
                <div class="player-info">
                    <div class="rank-box">${rank}</div>
                    <img src="${p.image}" class="player-icon" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'"> 
                    <span>${p.name}</span>
                </div>
                <div class="score-box" style="padding: 4px 12px; font-size: 16px;">${p.assists}</div>
            </div>`;
        });
        document.getElementById('top-assists').innerHTML = topAssistsHtml;

        let isBracketView = false;

        function toggleViewMode() {
            isBracketView = !isBracketView;
            let btn = document.getElementById('toggleViewBtn');
            if (isBracketView) {
                btn.innerText = "📋 عرض الجدول";
            } else {
                btn.innerText = "🔀 عرض شجري";
            }
            renderMatchesSection();
        }

        function getWinner(matchIndex, defaultName) {
            let m = DB.matches[matchIndex];
            if (!m) return defaultName;
            if (m.status !== 'finished') return defaultName;
            if (m.score1 > m.score2) return m.team1;
            if (m.score2 > m.score1) return m.team2;
            return "تعادل";
        }

        function renderMatchesSection() {
            if (DB.settings.leagueEnded) {
                document.getElementById('matches-display-area').innerHTML = `
                    <div class="styled-box" style="padding: 30px 20px; text-align: center; margin-top: 10px;">
                        <div style="color: var(--gold); font-size: 20px; font-weight: bold; line-height: 1.6;">
                            انتهى الدوري وسيبدأ الدوري الجديد قريباً... ⏳
                        </div>
                    </div>
                `;
                return;
            }

            if (isBracketView) {
                let matches = DB.matches || [];
                let totalMatches = matches.length;

                // توليد كروت المباريات بشكل ديناميكي حسب العدد المضاف
                let leftCards = "";
                let rightCards = "";
                let centerHub = `<div class="hub-trophy-label">🏆 بطل الدوري</div>`;

                let half = Math.ceil(totalMatches / 2);

                matches.forEach((m, idx) => {
                    let score1 = m.status === 'finished' ? m.score1 : '-';
                    let score2 = m.status === 'finished' ? m.score2 : '-';
                    
                    let cardHtml = `
                    <div class="bracket-node-card">
                        <div style="font-size: 8px; color: var(--text-muted); text-align: center; margin-bottom: 2px;">مباراة ${idx + 1}</div>
                        <div class="bracket-row-match"><span class="bracket-team-txt">${m.team1 || '---'}</span><span class="bracket-num-badge">${score1}</span></div>
                        <div class="bracket-row-match"><span class="bracket-team-txt">${m.team2 || '---'}</span><span class="bracket-num-badge">${score2}</span></div>
                    </div>`;

                    // إذا كانت المباراة الأخيرة وغالباً هي النهائي
                    if (idx === totalMatches - 1 && totalMatches > 1) {
                        centerHub += `
                        <div class="hub-match-box" style="border-color: var(--gold); background: rgba(55, 40, 85, 0.95);">
                            <div style="font-size: 9px; color: var(--gold); font-weight: bold;">النهائي الكبير (مباره ${idx + 1})</div>
                            <div class="bracket-row-match"><span class="bracket-team-txt">${m.team1 || '---'}</span><span class="bracket-num-badge">${score1}</span></div>
                            <div class="bracket-row-match"><span class="bracket-team-txt">${m.team2 || '---'}</span><span class="bracket-num-badge">${score2}</span></div>
                        </div>`;
                    } else if (idx < half) {
                        leftCards += cardHtml;
                    } else {
                        rightCards += cardHtml;
                    }
                });

                let bracketHtml = `
                <div class="bracket-scroll-wrapper">
                    <div class="bracket-master-container">
                        <div style="font-size: 11px; color: var(--gold); margin-bottom: 8px; font-weight: bold; text-align: center;">
                            📊 مخطط المواجهات (عدد المباريات: ${totalMatches})
                        </div>
                        <div class="dynamic-tree-flex">
                            <div class="bracket-column">${leftCards || '<div style="color:var(--text-muted);font-size:11px;">لا توجد مباريات</div>'}</div>
                            <div class="bracket-column" style="max-width: 130px; justify-content: center;">${centerHub}</div>
                            <div class="bracket-column">${rightCards || '<div style="color:var(--text-muted);font-size:11px;">لا توجد مباريات</div>'}</div>
                        </div>
                    </div>
                </div>`;
                
                document.getElementById('matches-display-area').innerHTML = bracketHtml;

            } else {
                // عرض الجدول العادي المفتوح لكل المباريات
                let matchesHtml = "";
                DB.matches.forEach((m, index) => {
                    let t1Class = "", t2Class = "", check1 = "", check2 = "";
                    let score1 = m.status === 'finished' ? m.score1 : '0';
                    let score2 = m.status === 'finished' ? m.score2 : '0';
                    
                    let boxLabel = m.status === 'finished' ? 'انتهت' : 'مباراة قادمة';
                    let boxClass = m.status === 'finished' ? 'styled-box finished-box' : 'styled-box';

                    if(m.status === "finished") {
                        if(m.score1 > m.score2) { t1Class = "winner"; t2Class = "loser"; check1 = "✅"; }
                        else if(m.score2 > m.score1) { t2Class = "winner"; t1Class = "loser"; check2 = "✅"; }
                    }
                    
                    matchesHtml += `
                    <div class="${boxClass}">
                        <div class="box-header">
                            <span>${boxLabel}</span>
                            <span>مباراة رقم ${index + 1}</span>
                        </div>
                        <hr class="box-divider">
                        <div class="box-content">
                            <div class="team-name team-right ${t1Class}">${check1} ${m.team1}</div>
                            <div class="score-container">
                                <div class="score-box">${score1}</div>
                                <div>VS</div>
                                <div class="score-box">${score2}</div>
                            </div>
                            <div class="team-name team-left ${t2Class}">${m.team2} ${check2}</div>
                        </div>
                    </div>`;
                });
                document.getElementById('matches-display-area').innerHTML = matchesHtml;
            }
        }

        renderMatchesSection();
    </script>
</body>
</html>
