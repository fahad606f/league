<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دوري الأبطال</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 15px;
            border-bottom: 1px solid #eeeeee;
        }
        th {
            background-color: #27ae60;
            color: white;
            font-weight: bold;
        }
        tr:hover {
            background-color: #f1f9f4;
        }
        .points {
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>
<body>

    <h1>🏆 جدول ترتيب دوري الأبطال 🏆</h1>

    <table>
        <thead>
            <tr>
                <th>المركز</th>
                <th>الفريق</th>
                <th>لعب</th>
                <th>فاز</th>
                <th>تعادل</th>
                <th>خسر</th>
                <th>النقاط</th>
            </tr>
        </thead>
        <tbody>
            <!-- الفريق الأول -->
            <tr>
                <td>1</td>
                <td>فريق الصقور</td>
                <td>3</td>
                <td>3</td>
                <td>0</td>
                <td>0</td>
                <td class="points">9</td>
            </tr>
            <!-- الفريق الثاني -->
            <tr>
                <td>2</td>
                <td>فريق النمور</td>
                <td>3</td>
                <td>2</td>
                <td>1</td>
                <td>0</td>
                <td class="points">7</td>
            </tr>
            <!-- الفريق الثالث -->
            <tr>
                <td>3</td>
                <td>فريق الأبطال</td>
                <td>3</td>
                <td>1</td>
                <td>1</td>
                <td>1</td>
                <td class="points">4</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
