<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية | دوري الأبطال</title>
    <!-- استدعاء البيانات -->
    <script src="data.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --gold: #FFD700;
            --green: #4CAF50;
            --red: #f44336;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 15px; text-align: center;
        }
        /* الأقسام والبطاقات بزوايا دائرية */
        .section-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin: 20px auto;
            max-width: 90%; /* تمدد تلقائي ولا يملأ الشاشة بالكامل */
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        /* البنر الإعلاني */
        #ad-banner {
            background: linear-gradient(90deg, #ff8a00, #e52e71);
            color: white; padding: 10px; border-radius: 15px; font-weight: bold;
            overflow: hidden; white-space: nowrap; margin-bottom: 20px; display: none;
        }
        .marquee { display: inline-block; animation: marquee 10s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        /* الجداول مقلصة */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid #333; font-size: 14px; }
        th { color: var(--gold); }
        img.player-icon { width: 30px; height: 30px; border-radius: 50%; vertical-align: middle; margin-left: 10px; }

        /* نجم المباراة (MVP) */
        .mvp-box { border: 2px solid var(--gold); position: relative; }
        .mvp-img-wrapper {
            position: relative; width: 100px; height: 100px; margin: 10px auto;
            border-radius: 50%; border: 3px solid var(--gold); overflow: hidden;
        }
        .mvp-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        /* اللمعة المتحركة */
        .mvp-img-wrapper::after {
            content: ""; position: absolute; top: 0; left: -100%;
            width: 50%; height: 100%; background: rgba(255,255,255,0.4);
            transform: skewX(-20deg); animation: shine 3s infinite;
        }
        @keyframes shine { 100% { left: 200%; } }

        /* مواجهات خروج المغلوب */
        .match-box {
            background: #2a2a2a; border-radius: 12px; padding: 15px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .match-box.finished { opacity: 0.7; }
        .team { width: 40%; font-weight: bold; }
        .score { width: 20%; font-size: 20px; color: var(--gold); }
        .winner { color: var(--green); }
        .loser { text-decoration: line-through; color: var(--red); }

        /* الأزرار */
        .nav-buttons a, .admin-btn {
            display: inline-block; padding: 10px 20px; background: #333; color: white;
            text-decoration: none; border-radius: 10px; margin: 5px; border: 1px solid #555;
            cursor: pointer; font-family: inherit; font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- البنر الإعلاني -->
    <div id="ad-banner"><div class="marquee" id="ad-text"></div></div>

    <!-- أزرار التنقل -->
    <div class="nav-buttons">
        <a href="league.html">إحصائيات اللاعبين</a>
        <a href="history.html">السجل الشرفي</a>
    </div>

    <!-- أعلى الهدافين والصناع -->
    <div class="section-card">
        <h3 style="color: var(--gold);">⚽ أعلى 3 هدافين</h3>
        <table><tbody id="top-scorers"></tbody></table>
        
        <h3 style="color: var(--gold); margin-top: 20px;">🎯 أعلى 3 صناع لعب</h3>
        <table><tbody id="top-assists"></tbody></table>
    </div>

    <!-- نجم المباراة -->
    <div class="section-card mvp-box">
        <h3 style="color: var(--gold);">🌟 نجم الجولة الأخيرة 🌟</h3>
        <div class="mvp-img-wrapper">
            <img id="mvp-img" src="" alt="MVP">
        </div>
        <h2 id="mvp-name"></h2>
    </div>

    <!-- خروج المغلوب -->
    <div class="section-card">
        <h3 style="color: var(--gold);">⚔️ مواجهات خروج المغلوب</h3>
        <div id="matches-container"></div>
    </div>

    <!-- زر الإدارة -->
    <button class="admin-btn" onclick="checkAdmin()">⚙️ دخول الإدارة</button>

    <script>
        // 1. تفعيل البنر الإعلاني
        if(DB.settings.showBanner) {
            document.getElementById('ad-banner').style.display = 'block';
            document.getElementById('ad-text').innerText = DB.settings.bannerText;
        }

        // 2. تفعيل نجم المباراة
        document.getElementById('mvp-img').src = DB.lastMvp.image;
        document.getElementById('mvp-name').innerText = DB.lastMvp.name;

        // 3. جلب وترتيب أعلى الهدافين وصناع اللعب
        let players = DB.players.slice();
        
        // الهدافين (تنازلياً)
        let topScorers = players.sort((a, b) => b.goals - a.goals).slice(0, 3);
        topScorers.forEach(p => {
            document.getElementById('top-scorers').innerHTML += `<tr><td style="text-align:right;"><img src="${p.image}" class="player-icon"> ${p.name}</td><td>${p.goals} هدف</td></tr>`;
        });

        // صناع اللعب (تنازلياً)
        let topAssists = players.sort((a, b) => b.assists - a.assists).slice(0, 3);
        topAssists.forEach(p => {
            document.getElementById('top-assists').innerHTML += `<tr><td style="text-align:right;"><img src="${p.image}" class="player-icon"> ${p.name}</td><td>${p.assists} صناعة</td></tr>`;
        });

        // 4. عرض المباريات وتلوين الفائز والخاسر
        let matchesHtml = "";
        DB.matches.forEach(m => {
            let t1Class = "", t2Class = "", check1 = "", check2 = "";
            if(m.status === "finished") {
                if(m.score1 > m.score2) { t1Class = "winner"; t2Class = "loser"; check1 = "✅"; }
                else if(m.score2 > m.score1) { t2Class = "winner"; t1Class = "loser"; check2 = "✅"; }
            }
            
            matchesHtml += `
            <div class="match-box ${m.status}">
                <div class="team ${t1Class}">${check1} ${m.team1}</div>
                <div class="score">${m.status === 'finished' ? m.score1 + ' - ' + m.score2 : 'VS'}</div>
                <div class="team ${t2Class}">${m.team2} ${check2}</div>
            </div>`;
        });
        document.getElementById('matches-container').innerHTML = matchesHtml;

        // 5. نظام الإدارة
        function checkAdmin() {
            let pass = prompt("أدخل الرقم السري للإدارة:");
            if(pass === "322332") {
                alert("سيتم تحويلك لملف قواعد البيانات. قم بتعديل الأرقام والأسماء واضغط Save.");
                // استبدل f606فهد باسم حسابك الفعلي في الرابط أدناه إذا لزم الأمر
                window.location.href = "https://github.com/f606f/دوري/edit/main/data.js"; 
            } else if (pass !== null) {
                alert("الرقم السري خاطئ!");
            }
        }
    </script>
</body>
</html>
