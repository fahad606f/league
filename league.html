<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إحصائيات اللاعبين | دوري الأبطال</title>
    <script src="data.js"></script>
    <style>
        :root {
            --bg-color: #243456; 
            --card-bg: #354a78; 
            --score-bg: #465f9a; 
            --text-main: #ffffff;
            --text-muted: #c5d2ee; 
            --gold: #FFD700;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 15px; text-align: center;
        }

        .nav-buttons { margin-bottom: 25px; }
        .nav-buttons a {
            display: inline-block; padding: 10px 20px; background: var(--score-bg); color: white;
            text-decoration: none; border-radius: 10px; margin: 5px; border: 1px solid rgba(255,255,255,0.15);
            font-weight: bold; font-size: 15px;
        }

        .page-title {
            color: var(--gold);
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .table-container {
            width: 100%; 
            margin: 0 auto 30px auto;
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        /* تقليل الفراغات في العناوين العلوية */
        th {
            background-color: var(--score-bg);
            padding: 12px 10px;
            color: var(--gold);
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
        
        th.text-right {
            text-align: right;
            padding-right: 20px;
        }

        /* تقليل الفراغات (الارتفاع) بين الأسماء */
        td {
            padding: 8px 10px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 17px;
            font-weight: bold;
            vertical-align: middle;
            text-align: center;
        }

        tr:last-child td { 
            border-bottom: none; 
        }

        .player-info {
            display: flex; 
            align-items: center; 
            justify-content: start; 
            gap: 12px;
            padding-right: 5px;
        }

        /* تنسيق مربع الترتيب بلون أغمق */
        .rank-box {
            min-width: 28px;
            height: 28px;
            background-color: rgba(0, 0, 0, 0.3);
            color: var(--gold);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }

        .player-icon {
            width: 45px; 
            height: 45px;
            border-radius: 50%; 
            object-fit: cover;
            border: 2px solid var(--gold);
        }
    </style>
</head>
<body>

    <div class="nav-buttons">
        <a href="index.html">⬅️ العودة للرئيسية</a>
        <a href="history.html">🏆 السجل الشرفي</a>
    </div>

    <div class="page-title">📊 الترتيب العام للاعبين</div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="text-right">اللاعب</th>
                    <th>⚽<br>أهداف</th>
                    <th>🎯<br>صناعة</th>
                    <th>🌟<br>MVP</th>
                </tr>
            </thead>
            <tbody id="players-table-body">
                <!-- سيتم جلب البيانات وإضافة الترتيب تلقائياً من الجافاسكربت -->
            </tbody>
        </table>
    </div>

    <script>
        let players = DB.players.slice();
        
        // ترتيب اللاعبين تنازلياً: الأهداف ثم الصناعة
        players.sort((a, b) => {
            if (b.goals !== a.goals) return b.goals - a.goals;
            return b.assists - a.assists;
        });

        let tableHtml = "";
        // تم إضافة index لمعرفة ترتيب اللاعب (يبدأ من 0 لذلك نضيف 1)
        players.forEach((p, index) => {
            let rank = index + 1;
            tableHtml += `
            <tr>
                <td>
                    <div class="player-info">
                        <div class="rank-box">${rank}</div>
                        <img src="${p.image}" class="player-icon" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'"> 
                        <span>${p.name}</span>
                    </div>
                </td>
                <td>${p.goals}</td>
                <td>${p.assists}</td>
                <td>${p.mvps}</td>
            </tr>`;
        });
        
        document.getElementById('players-table-body').innerHTML = tableHtml;
    </script>
</body>
</html>
