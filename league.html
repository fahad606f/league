<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إحصائيات اللاعبين | دوري الأبطال</title>
    <script src="data.js"></script>
    <style>
        :root {
            --bg-color: #243456; 
            --card-bg: #354a78; 
            --score-bg: #465f9a; 
            --text-main: #ffffff;
            --text-muted: #c5d2ee; 
            --gold: #FFD700;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 15px; text-align: center;
        }
        .styled-box {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            margin: 0 auto 15px auto;
            max-width: 75%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .box-header {
            display: flex; justify-content: space-between; font-size: 12px;
            color: var(--text-muted); margin-bottom: 10px; font-weight: bold;
        }
        .box-divider {
            border: 0; height: 1px; background: rgba(255, 255, 255, 0.15); margin-bottom: 12px;
        }
        .player-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); font-size: 14px;
        }
        .player-row:last-child { border-bottom: none; }
        .player-info { display: flex; align-items: center; gap: 10px; }
        img.player-icon { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 1px solid var(--gold); }
        .stats-container { display: flex; gap: 8px; font-size: 12px; }
        .stat-badge {
            background-color: var(--score-bg); padding: 4px 8px;
            border-radius: 6px; color: var(--text-main); text-align: center;
        }
        .nav-btn {
            display: inline-block; padding: 10px 20px; background: var(--score-bg); color: white;
            text-decoration: none; border-radius: 10px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.15);
            font-weight: bold; font-size: 13px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="nav-btn">⬅ العودة للرئيسية</a>

    <div class="styled-box">
        <h3 style="color: var(--gold); margin-top: 0;">📊 إحصائيات اللاعبين</h3>
        <div class="box-header">
            <span>اللاعب</span>
            <span>(أهداف / صناعة / MVP)</span>
        </div>
        <hr class="box-divider">
        <div id="players-list"></div>
    </div>

    <script>
        let players = DB.players.slice();
        // الترتيب تلقائياً من حيث الأعلى أهدافاً
        players.sort((a, b) => b.goals - a.goals);

        let html = "";
        players.forEach((p, index) => {
            html += `
            <div class="player-row">
                <div class="player-info">
                    <span style="color: var(--gold); font-weight: bold; width: 20px;">#${index + 1}</span>
                    <img src="${p.image}" class="player-icon">
                    <span style="font-weight: bold;">${p.name}</span>
                </div>
                <div class="stats-container">
                    <div class="stat-badge" title="الأهداف">⚽ ${p.goals}</div>
                    <div class="stat-badge" title="الصناعة">🎯 ${p.assists}</div>
                    <div class="stat-badge" title="MVP">🌟 ${p.mvps}</div>
                </div>
            </div>`;
        });
        document.getElementById('players-list').innerHTML = html;
    </script>
</body>
</html>
